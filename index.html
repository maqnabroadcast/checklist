<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maqna Event Checklist</title>
  <link rel="icon" href="https://i.postimg.cc/6qyL5M8T/logo-favicon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation; clipboard-write;">
    </iframe>
  </div>

  <script>
    (function() {
      // Your Google Apps Script Web App Base URL
      const baseUrl = "https://script.google.com/macros/s/AKfycbxmHyuZQvKJKDN5lWNssSVbFbtXh6wYpDPCY4hcTc-sXWutzyTntUKKOhFRpsQ2rLTh/exec";
      
      // Captures URL parameters (e.g., ?mode=guest&rd=RD-xxxx)
      const currentParams = window.location.search;
      
      // Dynamically load the Google Apps Script inside the iframe with guest params attached
      document.getElementById('app').src = baseUrl + currentParams;
    })();
  </script>
</body>
</html>
